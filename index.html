<!DOCTYPE html>
<html lang="en-us">
	<head>
		<meta charset="UTF-8" />
		<meta name="description" content="Rain music to relax" />
		<meta name="keywords" content="rain, rain chill, yuri cunha" />

		<link rel="canonical" href="https://www.rain-for-relax.yuricunha.com/" />

		<script>
			document.addEventListener("contextmenu", function (event) {
				event.preventDefault();
			});
		</script>

		<script>
			// This code tries to prevent console from opening
			Object.defineProperty(window, "console", {
				value: {
					log: function () {},
					warn: function () {},
					error: function () {},
					debug: function () {},
				},
				configurable: false,
				enumerable: false,
				writable: false,
			});

		<script
			defer
			src="https://umami.yuricunha.com/script.js"
			data-website-id="ae078a6c-02fb-45c2-96d3-3274da991093"
		></script>
	</head>
	<body>
		<video id="background-video" autoplay loop muted>
			<source src="assets/chill-rain.mp4" type="video/mp4" />
		</video>
		<center>
			<div class="centered">
				<img
					id="logo"
					style="width: 25%"
					src="assets/images/cloud.png"
					alt="Logo"
				/>
				<h1>Just appreciate. <a>Relax.</a> Be well.</h1>
				<audio id="rain-audio" autoplay loop>
					<source src="assets/rain-chill.mp3" type="audio/mp3" />
				</audio>
				<div class="volume-control">
					<button id="mute-btn" aria-label="Mute/Unmute">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
							<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
							<line x1="12" y1="19" x2="12" y2="23"></line>
							<line x1="8" y1="23" x2="16" y2="23"></line>
						</svg>
					</button>
					<input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" aria-label="Volume control">
				</div>
				<div class="sleep-timer">
					<button id="timer-btn" aria-label="Sleep Timer">
						<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
							<circle cx="12" cy="12" r="10"></circle>
							<polyline points="12 6 12 12 16 14"></polyline>
						</svg>
					</button>
					<div id="timer-options" class="timer-options">
						<button data-minutes="5">5 min</button>
						<button data-minutes="15">15 min</button>
						<button data-minutes="30">30 min</button>
						<button data-minutes="60">60 min</button>
						<button id="cancel-timer">Cancel</button>
					</div>
					<div id="timer-display" class="timer-display"></div>
				</div>
				<div id="keyboard-help" class="keyboard-help">
					<span>↑/↓: Volume | M: Mute | Space: Toggle</span>
				</div>
				<h2>
					And, <a href="javascript:history.go(0)">click here to begin.</a> 🌧️
				</h2>
				<div>
					<a href="https://github.com/isyuricunha" target="_blank">
						<img
							style="width: 5%"
							src="assets/images/github.png"
							alt="GitHub"
							title="GitHub"
						/>
					</a>
					<a
						href="https://discordapp.com/users/1018988240151253002"
						target="_blank"
					>
						<img
							style="width: 5%"
							src="assets/images/discord.png"
							alt="Discord"
							title="Discord"
						/>
					</a>
					<a href="mailto:me@yuricunha.com" target="_blank">
						<img
							style="width: 5%"
							src="assets/images/mail.png"
							alt="E-mail"
							title="E-mail"
						/>
					</a>
					<a href="https://t.me/isyuricunha" target="_blank">
						<img
							style="width: 5%"
							src="assets/images/telegram.png"
							alt="Telegram"
							title="Telegram"
						/>
					</a>
					<a href="https://www.yuricunha.com/" target="_blank">
						<img
							style="width: 5%"
							src="assets/images/website.png"
							alt="Website"
							title="Website"
						/>
					</a>
					<a href="https://www.linkedin.com/in/isyuricunha/" target="_blank">
						<img
							style="width: 5%"
							src="assets/images/linkedin.png"
							alt="LinkedIn"
							title="LinkedIn"
						/>
					</a>
				</div>
			</div>
		</center>
		<script>
			document.addEventListener('DOMContentLoaded', function() {
				const audio = document.getElementById('rain-audio');
				const volumeSlider = document.getElementById('volume-slider');
				const muteButton = document.getElementById('mute-btn');
				let isMuted = false;
                let lastVolume = 0.5; // Default volume

				// Set initial volume
                audio.volume = lastVolume;
                volumeSlider.value = lastVolume;

				// Update volume when slider changes
				volumeSlider.addEventListener('input', function() {
					audio.volume = this.value;
                    lastVolume = this.value;
                    isMuted = false;
                    updateMuteButton();
				});

				// Toggle mute when button is clicked
				muteButton.addEventListener('click', function() {
					if (isMuted) {
						// Unmute
						audio.volume = lastVolume || 0.5;
						volumeSlider.value = lastVolume || 0.5;
					} else {
						// Mute
						lastVolume = audio.volume;
						audio.volume = 0;
						volumeSlider.value = 0;
					}
					isMuted = !isMuted;
					updateMuteButton();
				});

				// Update mute button icon based on mute state
				function updateMuteButton() {
					const icon = muteButton.querySelector('svg');
					if (isMuted || audio.volume === 0) {
						icon.innerHTML = `
							<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
							<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
							<line x1="12" y1="19" x2="12" y2="23"></line>
							<line x1="8" y1="23" x2="16" y2="23"></line>
							<line x1="5" y1="5" x2="19" y2="19" stroke="red" stroke-width="2">
						`;
					} else {
						icon.innerHTML = `
							<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
							<path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
							<line x1="12" y1="19" x2="12" y2="23"></line>
							<line x1="8" y1="23" x2="16" y2="23"></line>
						`;
					}
				}

				// Initialize button state
				updateMuteButton();

				// Save volume preference in localStorage
				function saveVolumePreference() {
					localStorage.setItem('rainVolume', audio.volume);
				}

				// Load volume preference from localStorage
				function loadVolumePreference() {
					const savedVolume = localStorage.getItem('rainVolume');
					if (savedVolume !== null) {
						audio.volume = parseFloat(savedVolume);
						volumeSlider.value = savedVolume;
						lastVolume = parseFloat(savedVolume);
					}
				}

				// Load saved preferences
				loadVolumePreference();

				// Save preferences when volume changes
				audio.addEventListener('volumechange', saveVolumePreference);

				// Handle keyboard help notification
				const keyboardHelp = document.getElementById('keyboard-help');
				let helpTimeout;

				function hideKeyboardHelp() {
					keyboardHelp.style.animation = 'fadeOut 0.5s ease-out forwards';
					sessionStorage.setItem('keyboardHelpShown', 'true');
				}

				// Hide help after delay or on first interaction
				function setupKeyboardHelp() {
					if (sessionStorage.getItem('keyboardHelpShown')) {
						keyboardHelp.style.display = 'none';
						return;
					}

					helpTimeout = setTimeout(hideKeyboardHelp, 8000);

					// Hide on any interaction
					const hideOnInteraction = () => {
						clearTimeout(helpTimeout);
						hideKeyboardHelp();
						document.removeEventListener('click', hideOnInteraction);
						document.removeEventListener('keydown', hideOnInteraction);
						volumeSlider.removeEventListener('input', hideOnInteraction);
						muteButton.removeEventListener('click', hideOnInteraction);
					};

					document.addEventListener('click', hideOnInteraction);
					document.addEventListener('keydown', hideOnInteraction);
					volumeSlider.addEventListener('input', hideOnInteraction);
					muteButton.addEventListener('click', hideOnInteraction);
				}

				// Initialize keyboard help
				setupKeyboardHelp();

				// Keyboard shortcuts
				document.addEventListener('keydown', function(e) {
					switch(e.key) {
						case ' ':
						case 'Enter':
							e.preventDefault(); // Prevent default space/enter behavior
							toggleMute();
							break;
						case 'm':
						case 'M':
							toggleMute();
							break;
						case 'ArrowUp':
							e.preventDefault(); // Prevent page scrolling
							adjustVolume(0.1);
							break;
						case 'ArrowDown':
							e.preventDefault(); // Prevent page scrolling
							adjustVolume(-0.1);
							break;
					}
				});

				// Toggle mute function
				function toggleMute() {
					if (isMuted) {
						audio.volume = lastVolume || 0.5;
						volumeSlider.value = lastVolume || 0.5;
					} else {
						lastVolume = audio.volume;
						audio.volume = 0;
						volumeSlider.value = 0;
					}
					isMuted = !isMuted;
					updateMuteButton();
				}

				// Adjust volume by a delta amount
				function adjustVolume(delta) {
					let newVolume = parseFloat(audio.volume) + delta;
					newVolume = Math.min(1, Math.max(0, newVolume)); // Clamp between 0 and 1
					audio.volume = newVolume;
					volumeSlider.value = newVolume;
					lastVolume = newVolume;
					isMuted = false;
					updateMuteButton();
				}

				// Sleep Timer Functionality
				const timerBtn = document.getElementById('timer-btn');
				const timerOptions = document.getElementById('timer-options');
				const timerDisplay = document.getElementById('timer-display');
				let timerInterval;
				let endTime;

				// Toggle timer options
				timerBtn.addEventListener('click', function() {
					timerOptions.style.display = timerOptions.style.display === 'flex' ? 'none' : 'flex';
				});

				// Start timer
				timerOptions.querySelectorAll('button[data-minutes]').forEach(button => {
					button.addEventListener('click', function() {
						const minutes = parseInt(this.getAttribute('data-minutes'));
						startTimer(minutes * 60); // Convert minutes to seconds
						timerOptions.style.display = 'none';
					});
				});

				// Cancel timer
				document.getElementById('cancel-timer').addEventListener('click', function() {
					clearInterval(timerInterval);
					timerDisplay.textContent = '';
					timerBtn.classList.remove('timer-active');
					timerOptions.style.display = 'none';
				});

				// Start the timer
				function startTimer(duration) {
					clearInterval(timerInterval);
					endTime = Date.now() + duration * 1000;
					timerBtn.classList.add('timer-active');
					updateTimerDisplay();
					timerInterval = setInterval(updateTimerDisplay, 1000);
				}

				// Update the timer display
				function updateTimerDisplay() {
					const now = Date.now();
					const remaining = Math.max(0, Math.ceil((endTime - now) / 1000));

					if (remaining <= 0) {
						clearInterval(timerInterval);
						audio.pause();
						timerDisplay.textContent = 'Timer: Complete';
						timerBtn.classList.remove('timer-active');
						setTimeout(() => {
							timerDisplay.textContent = '';
						}, 3000);
						return;
					}

					const minutes = Math.floor(remaining / 60);
					const seconds = remaining % 60;
					timerDisplay.textContent = `Timer: ${minutes}:${seconds.toString().padStart(2, '0')}`;
				}

				// Close timer options when clicking outside
				document.addEventListener('click', function(event) {
					if (!event.target.closest('.sleep-timer') && !event.target.closest('#timer-options')) {
						timerOptions.style.display = 'none';
					}
				});

				// Keyboard shortcut for timer (T key)
				document.addEventListener('keydown', function(e) {
					if (e.key.toLowerCase() === 't') {
						timerOptions.style.display = timerOptions.style.display === 'flex' ? 'none' : 'flex';
						e.preventDefault();
					}
				});
			});
		</script>
	</body>
</html>
